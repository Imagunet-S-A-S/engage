name: "Plugin release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package"
        required: true
        type: string

jobs:
  create-release:
    name: "Create release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Extract tag name"
        id: "release-vars"
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
      - name: "Checkout"
        uses: "actions/checkout@v3"
        with:
          ref: ${{ steps.release-vars.outputs.tag_name }}
      - name: "Build package"
        id: "build-package"
        uses: "glpi-project/tools/github-actions/build-package@0.6.2"
        with:
          plugin-version: ${{ steps.release-vars.outputs.tag_name }}
      - name: "Create release"
        id: "create-release"
        uses: "actions/create-release@v1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release-vars.outputs.tag_name }}
          release_name: ${{ steps.release-vars.outputs.tag_name }}
          draft: true
      - name: "Attach package to release"
        uses: "actions/upload-release-asset@v1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ${{ steps.build-package.outputs.package-path }}
          asset_name: ${{ steps.build-package.outputs.package-basename }}
          asset_content_type: "application/x-bzip2"
