name: "Plugin release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package"
        required: true
        type: string

jobs:
  create-release:
    name: "Create release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Extract tag name"
        id: "release-vars"
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
      - name: "Checkout"
        uses: "actions/checkout@v4"
        with:
          ref: ${{ steps.release-vars.outputs.tag_name }}
      - name: "Extract changelog for this version"
        id: "changelog"
        run: |
          # Pull the block between the first two "## [" headings from CHANGELOG.md
          body=$(awk '/^## \[/{if(found){exit} found=1; next} found{print}' CHANGELOG.md)
          # Write to a temp file to avoid shell quoting issues with multiline strings
          echo "$body" > /tmp/release-body.md
      - name: "Build package"
        id: "build-package"
        uses: "glpi-project/tools/github-actions/build-package@0.6.2"
        with:
          plugin-version: ${{ steps.release-vars.outputs.tag_name }}
      - name: "Publish release"
        uses: "softprops/action-gh-release@v2"
        with:
          tag_name: ${{ steps.release-vars.outputs.tag_name }}
          name: ${{ steps.release-vars.outputs.tag_name }}
          body_path: /tmp/release-body.md
          draft: false
          files: ${{ steps.build-package.outputs.package-path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
